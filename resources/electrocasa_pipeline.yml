resources:
  pipelines:
    electrocasa_pipeline:

      name: electrocasa_pipeline_${bundle.target}

      catalog: ${var.catalog}
      target: bronze

      serverless: true
      continuous: false

      configuration:
        electrocasa.catalog: ${var.catalog}

      libraries:
        - file:
            path: ../src/electrocasa/transformations/bronze.py

        - file:
            path: ../src/electrocasa/transformations/silver.py

        - file:
            path: ../src/electrocasa/transformations/gold.py